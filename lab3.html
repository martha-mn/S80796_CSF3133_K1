<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Header Section -->
    <div id="header">
        <h1>Inline Calculator</h1>
        <span>Website that performs inline calculations for you.</span>
    </div>

    <!-- Main Content Area -->
    <div id="content">
        <h2>Contact Form</h2>
        <form>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail"><br><br>
            <label for="date">Preferred contact date:</label><br>
            <input type="date" id="date" name="date"><br><br>
            <label for="satisfaction">Satisfaction level:</label><br>
            <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" step="1"><br><br>
            <input type="submit" value="Submit">
        </form>
    </div>

    <!-- Inline Calculator -->
    <div id="inlinecalc">
        <h2>Inline Calculator</h2>
        <form oninput="results.value=parseInt(number1.value)+parseInt(number2.value)">
            <input type="text" id="number1" name="number1" value="0">0<br>+
            <input type="text" id="number2" name="number2" value="0">0<br>=
            <output name="results" for="number1 number2"></output>
        </form>
    </div>

    <!-- Footer Section-->
    <div id="footer">
        <h2>Contact Information</h2>
        <p>Email: <a href="mailto:info@inlineCalc.com">info@inlineCalc.com</a></p>
        <p>&copy; 2026 Inline Calculator. All rights reserved.</p>
    </div>
</body>
</html>
