<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <main>
        <!-- Player section for name input and starting the game -->
        <section class="card">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button type="button" onclick="startGame()">Start Game</button>
            <p id="welcomeMsg"></p>
        </section>

    <!-- Game section with choice buttons and player vs computer images -->
        <section class="card">
            <div class="controls">
                <button type="button" onclick="playRound('rock')">Rock</button>
                <button type="button" onclick="playRound('paper')">Paper</button>
                <button type="button" onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="battle-arena">
                <div class="choice-box">
                    <h2>You</h2>
                    <img id="playerImg" src="rock.png" alt="Player Choice">
                </div>
                <div class="vs-text">VS</div>
                <div class="choice-box">
                    <h2>Computer</h2>
                    <img id="computerImg" src="rock.png" alt="Computer Choice">
                </div>
            </div>
        </section>

    <!-- Result and scoreboard section -->
        <section class="card">
            <p id="result"></p>
            <div class="scoreboard">
                <span>Wins: <span id="wins">0</span></span>
                <span>Losses: <span id="losses">0</span></span>
                <span>Draws: <span id="draws">0</span></span>
            </div>
        </section>

    <!-- History section with round log table and summary/reset buttons -->
        <section class="card">
            <h2>History</h2>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- Round rows will be inserted dynamically here -->
                </tbody>
            </table>

            <div class="action-buttons">
                <button type="button" onclick="showSummary()">Show Summary</button>
                <button type="button" onclick="resetGame()">Reset</button>
            </div>
            <p id="summaryText"></p>
        </section>
    </main>

    <!-- Footer section displaying start timestamp and copyright -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Link to external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
