<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design Knowledge Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Header introducing the quiz -->
        <header>
            <h1>Web Design Knowledge Quiz</h1>
            <p>Test your HTML, CSS, and JavaScript skills!</p>
        </header>

        <!-- Main section for questions, options, and timer -->
        <main id="quiz-section">
            <div class="timer-bar">
                Time Remaining: <span id="timer">15</span>s
            </div>
            
            <h2 id="question-text">Question goes here...</h2>
            
            <div id="options-container" class="options-grid">
                <!-- Answer options will be generated by JavaScript -->
            </div>

            <!-- Feedback section -->
            <div id="feedback" class="feedback hidden"></div>

            <!-- Action button to submit answer and move to next question -->
            <button id="action-btn">Submit Answer</button>
        </main>

        <!-- Footer to display the user's score -->
        <footer>
            <p id="score-display">Score: 0</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
